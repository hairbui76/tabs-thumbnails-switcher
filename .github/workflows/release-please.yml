name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - if: ${{ steps.release.outputs.release_created }}
        name: Upload extension zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          ZIP="tabs-thumbnails-switcher-${TAG}.zip"
          zip -r "$ZIP" \
            manifest.json \
            background.js \
            content.css \
            content.js \
            key-gesture.js \
            overlay-keys.js \
            debug-helpers.js \
            options.html \
            options.js \
            icons \
            LICENSE
          gh release upload "$TAG" "$ZIP" --clobber
